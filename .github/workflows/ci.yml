name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-index:
    name: Validate plugin index
    runs-on: [ubuntu-24, x64, small]
    steps:
      - uses: checkout

      - name: Set up Python
        uses: setup-python
        with:
          python-version: "3.12"

      - name: Validate index.json
        run: python scripts/validate_index.py
